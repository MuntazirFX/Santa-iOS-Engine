name: iOS Build on macOS Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile C++ Code
      run: |
        echo "Build process shuru ho raha hai..."
        # Yahan -std=c++17 add karna zaroori hai
        clang++ -std=c++17 -o engine_test src/main.cpp src/AssetManager.cpp
        ./engine_test
        echo "Build successful!"
