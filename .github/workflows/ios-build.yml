name: iOS Build on macOS Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile C++ Code
      run: |
        echo "Build process shuru ho raha hai..."
        clang++ -std=c++17 -o engine_test src/main.cpp src/AssetManager.cpp
        ./engine_test
        echo "Build successful!"

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build iOS App
      run: |
        xcodebuild build \
          -project SantaEngine.xcodeproj \
          -scheme SantaEngine \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/SantaEngine.app Payload/
        zip -r SantaEngine.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SantaEngine-IPA
        path: SantaEngine.ipa
