name: iOS Build on macOS Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile C++ Code
      run: |
        echo "Build process shuru ho raha hai..."
        # Nayi line: Dono cpp files ko compile karein
        clang++ -std=c++11 -o engine_test src/main.cpp src/AssetManager.cpp
        ./engine_test
        echo "Build successful!"
